name: site

# Builds and checks the web product. The workflow runs on every pull request and push to
# main so that `site-status` always reports; the heavy `site` job only runs when web/,
# the data pointer or this workflow changed (detected by the `changes` job). Mark ONLY
# `site-status` as a required check: it passes when `site` passed or was skipped by the
# path filter, and fails when `site` failed.
#
# Publication (Cloudflare Workers, static assets): on a push to main, `deploy` publishes the
# very build the `site` job tested, and `verify` checks the live site (verify-site.yml). On
# a pull request from this repository, `preview` uploads the same build as a preview version
# (pr-<number>-atlas-da-lavoura.<account>.workers.dev) without touching production; it is
# skipped, not failed, for Dependabot and forks (no access to the token), and is not a
# required check. The token lives in the `production` and `preview` environments.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      web: ${{ steps.filter.outputs.web }}
    steps:
      # paths-filter uses the GitHub API on pull requests and git on pushes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            web:
              - "web/**"
              - "data-release.json"
              - ".github/workflows/site.yml"

  site:
    name: Build and check the site
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    # Ceiling for the whole job (GitHub's default is 360 minutes). The network-bound and
    # browser steps carry tighter limits of their own, so a stall fails within minutes.
    timeout-minutes: 15
    env:
      # actions/cache and setup-node wait up to 10 minutes on a stalled cache segment by
      # default; give up sooner and carry on as a cache miss.
      SEGMENT_DOWNLOAD_TIMEOUT_MINS: 2
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The verified tarball is cached by the pointer's content, so the release asset is
      # downloaded again only when data-release.json changes.
      - name: Restore the data package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: web/.cache
          key: site-data-${{ hashFiles('data-release.json') }}

      - name: Install dependencies
        timeout-minutes: 5
        run: npm ci

      - name: Download, verify (sha256) and extract the data package
        timeout-minutes: 3
        run: npm run fetch-data

      - name: Generate TypeScript types from the JSON Schemas
        run: npm run generate-types

      - name: Smoke-validate the data against the contract (ajv)
        run: npm run validate-data

      - name: Type-check (astro check)
        run: npm run check

      - name: Component tests (Vitest)
        run: npm test

      - name: Build
        run: npm run build

      # Only the headless shell (the tests run headless) and no --with-deps: the
      # ubuntu-24.04 image already ships every library Chromium needs, and --with-deps
      # would make the job depend on apt and the Ubuntu mirrors. If a future image lacks
      # a library, Chromium fails at launch, in seconds, naming it.
      - name: Install the Playwright browser
        timeout-minutes: 3
        run: npx playwright install --only-shell chromium

      # Playwright's globalTimeout (playwright.config.ts) stops the run first, so the
      # report is still printed.
      - name: End-to-end and accessibility tests (Playwright + axe)
        timeout-minutes: 6
        run: npm run e2e

      # Lighthouse CI runs the runner image's Google Chrome.
      - name: Performance budget, desktop (Lighthouse CI)
        timeout-minutes: 6
        run: npm run lhci:desktop

      - name: Performance budget, mobile (Lighthouse CI)
        timeout-minutes: 6
        run: npm run lhci:mobile

      # The tested build, for the deploy or the preview: one compressed file uploads much
      # faster than six thousand small ones.
      - name: Package the tested build
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'pull_request' &&
           github.event.pull_request.head.repo.full_name == github.repository &&
           github.event.pull_request.user.login != 'dependabot[bot]')
        run: tar -czf ../site-dist.tgz dist

      - name: Keep the tested build for the next job
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'pull_request' &&
           github.event.pull_request.head.repo.full_name == github.repository &&
           github.event.pull_request.user.login != 'dependabot[bot]')
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-dist
          path: site-dist.tgz
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

  site-status:
    # The aggregator that branch protection requires: always reports, passes on success
    # or on a path-filter skip, fails when the site job failed or was cancelled.
    name: site-status
    needs: [changes, site]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Pass when the site job passed or was skipped
        env:
          SITE_RESULT: ${{ needs.site.result }}
        run: |
          echo "site job result: $SITE_RESULT"
          case "$SITE_RESULT" in
            success|skipped) exit 0 ;;
            *) exit 1 ;;
          esac

  deploy:
    name: Deploy to Cloudflare
    needs: site
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: production
      url: https://atlasdalavoura.com.br
    # One deploy at a time, never cancelled halfway.
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      SEGMENT_DOWNLOAD_TIMEOUT_MINS: 2
      WRANGLER_SEND_METRICS: "false"
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies (wrangler, pinned in the lockfile)
        timeout-minutes: 5
        run: npm ci

      - name: Fetch the tested build
        timeout-minutes: 3
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist

      - name: Unpack the tested build
        run: tar -xzf ../site-dist.tgz

      - name: Deploy (wrangler deploy)
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT: ${{ github.sha }}
        run: npx wrangler deploy --message "main ${COMMIT}"

  verify:
    name: Verify the published site
    needs: deploy
    uses: ./.github/workflows/verify-site.yml

  preview:
    name: Preview version (Cloudflare)
    needs: site
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: preview
      url: ${{ steps.upload.outputs.url }}
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      SEGMENT_DOWNLOAD_TIMEOUT_MINS: 2
      WRANGLER_SEND_METRICS: "false"
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies (wrangler, pinned in the lockfile)
        timeout-minutes: 5
        run: npm ci

      - name: Fetch the tested build
        timeout-minutes: 3
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist

      - name: Unpack the tested build
        run: tar -xzf ../site-dist.tgz

      # A new version with the alias pr-<number>; production keeps serving its own version.
      - name: Upload the preview version (wrangler versions upload)
        id: upload
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PR: ${{ github.event.pull_request.number }}
          COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          npx wrangler versions upload --preview-alias "pr-${PR}" --message "PR #${PR} ${COMMIT}" | tee ../upload.log
          url=$(grep -oE "https://pr-${PR}-[a-z0-9-]+\.[a-z0-9-]+\.workers\.dev" ../upload.log | head -n 1)
          test -n "$url"
          echo "url=${url}/" >> "$GITHUB_OUTPUT"

      - name: Check that the preview answers and stays out of search engines
        timeout-minutes: 2
        env:
          URL: ${{ steps.upload.outputs.url }}
        run: |
          headers=$(curl -sSI --retry 5 --retry-delay 5 --retry-all-errors "$URL")
          echo "$headers"
          echo "$headers" | grep -qiE "^HTTP/[0-9.]+ 200"
          echo "$headers" | grep -qiE "^x-robots-tag: noindex"
          printf '### Prévia\n\n%s\n' "$URL" >> "$GITHUB_STEP_SUMMARY"
