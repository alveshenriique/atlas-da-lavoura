name: verify-site

# Checks the published site (web/scripts/verify-site.mjs): HTTPS and the www redirect,
# certificates, the main pages, the security and cache headers, every inline script against
# the CSP, the 404 page and, in a real browser, no CSP violation on the Análise and the
# Explorar. Called by site.yml after each deploy, and runnable by hand from the Actions tab.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify the published site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SEGMENT_DOWNLOAD_TIMEOUT_MINS: 2
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        timeout-minutes: 5
        run: npm ci

      - name: Install the Playwright browser
        timeout-minutes: 3
        run: npx playwright install --only-shell chromium

      - name: Check the live site
        timeout-minutes: 5
        run: node scripts/verify-site.mjs https://atlasdalavoura.com.br --docs https://docs.atlasdalavoura.com.br/
